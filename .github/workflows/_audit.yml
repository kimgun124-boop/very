name: _audit (temporary)
on:
  push:
    branches: [audit-tmp]
permissions:
  contents: write
env:
  FULL: '1'
  TABS: '0'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: diag 52w
        if: env.FULL == '2'
        continue-on-error: true
        run: mkdir -p out && timeout 900 python _audit/diag52.py 2>&1 | tee out/diag_log.txt
      - name: fact check
        if: env.FULL == '1'
        continue-on-error: true
        run: mkdir -p out && timeout 1800 python _audit/fact_check.py out 2>&1 | tee out/fact_log.txt
      - name: render all tabs (real data)
        if: env.TABS == '1'
        continue-on-error: true
        run: timeout 3000 python _audit/run_tabs.py app.py out/tabs.json 2>&1 | grep -v "ScriptRunContext\|No runtime found\|st.iframe\|will be removed\|^$" | tee out/tabs_log.txt
      - name: push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          ls -la out || true
          git add -f out
          git commit -m "audit results" || true
          git push origin HEAD:refs/heads/audit-res -f
