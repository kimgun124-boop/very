name: 💵 현금창출 기업 재무 갱신

on:
  schedule:
    # 한국 시간 매월 6일·21일 아침 6:17 (UTC 전날 21:17). 숫자가 바뀐 달(분기 실적 반영)에만 파일이 커밋돼요.
    - cron: "17 21 5,20 * *"
  workflow_dispatch:

concurrency:
  group: cashflow-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests lxml
      - name: 보드 국내 종목 재무 받기 (밸류라인)
        run: python cashflow.py
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- cashflow_screen.json && [ -z "$(git ls-files --others -- cashflow_screen.json)" ]; then
            echo "바뀐 게 없어요"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add cashflow_screen.json
          git commit -m "💵 현금창출 기업 재무 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase origin main
          git push
