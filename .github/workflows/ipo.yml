name: 🆕 신규상장 갱신

on:
  schedule:
    # 한국 시간 평일 저녁 6:43 (UTC 9:43). KIND 신규상장·공모가·상장 예정을 받아 바뀌었을 때만 ipo_list.json을 커밋해요.
    - cron: "43 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ipo-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: KIND 신규상장 받기
        run: python ipo.py
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- ipo_list.json && [ -z "$(git ls-files --others -- ipo_list.json)" ]; then
            echo "바뀐 게 없어요"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ipo_list.json
          git commit -m "🆕 신규상장 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git pull --rebase origin main
          git push
