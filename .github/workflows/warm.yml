name: ⚡ 빠른 시작 묶음 만들기

on:
  schedule:
    # 한국 시간 매일 아침 7:23 (UTC 22:23) — 전날 일봉이 확정된 뒤, 장 시작 전에 만들어요
    - cron: "23 22 * * *"
  workflow_dispatch:

concurrency:
  group: warm-pack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 보드 종목 일봉·상장주식수·공식 52주 받기
        run: python -W ignore warm.py build /tmp/warm.npz
      - name: warm 브랜치에 덮어쓰기(main 기록은 그대로)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/w && cd /tmp/w
          git init -q
          git checkout -q --orphan warm
          cp /tmp/warm.npz .
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add warm.npz
          git commit -qm "⚡ 빠른 시작 묶음 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" warm
      - name: 앱 미리 깨우기
        continue-on-error: true
        run: curl -s -o /dev/null -w "%{http_code}\n" -m 30 https://hyoseok.streamlit.app/ || true
