[theme]
base = "light"
primaryColor = "#2E6B6F"
backgroundColor = "#F5F7F8"
secondaryBackgroundColor = "#E7EDEF"
textColor = "#16212B"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# 오류가 나도 화면에는 오류 종류만 보여요(코드·파일 경로가 밖으로 안 보이게). 자세한 내용은 Manage app → 로그
showErrorDetails = "type"

[server]
enableXsrfProtection = true
enableCORS = true
